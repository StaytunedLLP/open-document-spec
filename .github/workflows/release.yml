name: release

# Auto-release after CI succeeds on main/master.
# Version source of truth: Cargo.toml [workspace.package].version
# Tag format: vMAJOR.MINOR.PATCH (stable GitHub Releases only).
# Manual git tags do NOT trigger this workflow.
#
# End users install from release archives (manual first install, then ods update).
# Ships `ods` multi-OS archives only (no ods-lsp / Zed).

on:
  workflow_run:
    workflows: ["pr"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bump:
        description: "If current version is already tagged, force this bump"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  # One release at a time; queue others (do not cancel mid-build).
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "1"

jobs:
  # Resolve version on tip of main, tag, push (no stale workflow_run SHA)
  prepare:
    name: Prepare version & tag
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master'))
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      should_release: ${{ steps.plan.outputs.should_release }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
    steps:
      # Always tip of main so version bumps can push fast-forward (never stale CI SHA).
      - name: Checkout main tip
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Plan version and tag
        id: plan
        env:
          BUMP_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump || 'patch' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main --tags --force --quiet
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          read_version() {
            if [ -f Cargo.toml ]; then
              grep -E '^version\s*=' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/'
            elif [ -f src/Cargo.toml ]; then
              grep -E '^version\s*=' src/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/'
            else
              echo "error: Cargo.toml not found" >&2
              exit 1
            fi
          }

          write_version() {
            local v="$1"
            python3 -c "
          import os, re
          new_v = '''${v}'''
          path = 'Cargo.toml' if os.path.exists('Cargo.toml') else 'src/Cargo.toml'
          text = open(path, encoding='utf-8').read()
          text2, n = re.subn(r'(?m)^version\s*=\s*\"[^\"]+\"', f'version = \"{new_v}\"', text, count=1)
          if n != 1:
              raise SystemExit(f'expected to replace 1 version line, got {n}')
          open(path, 'w', encoding='utf-8').write(text2)
          lock_path = 'Cargo.lock' if os.path.exists('Cargo.lock') else 'src/Cargo.lock'
          lock = open(lock_path, encoding='utf-8').read()
          for name in ('odc', 'odc-core', 'odc-test-support'):
              lock, n = re.subn(
                  rf'(name = \"{name}\"\nversion = \")[^\"]+(\")',
                  rf'\g<1>{new_v}\2',
                  lock,
                  count=1,
              )
              if n != 1:
                  raise SystemExit(f'expected 1 lock version for {name}, got {n}')
          open(lock_path, 'w', encoding='utf-8').write(lock)
          "
          }

          bump_semver() {
            local v="$1" kind="$2"
            local major minor patch
            IFS=. read -r major minor patch <<<"${v}"
            case "$kind" in
              major) echo "$((major + 1)).0.0" ;;
              minor) echo "${major}.$((minor + 1)).0" ;;
              patch) echo "${major}.${minor}.$((patch + 1))" ;;
              *) echo "error: unknown bump ${kind}" >&2; exit 1 ;;
            esac
          }

          # True if a GitHub Release for this tag already has assets (fully published).
          release_has_assets() {
            local tag="$1"
            local n
            if command -v gh &>/dev/null; then
              n="$(gh api "repos/${REPO}/releases/tags/${tag}" --jq '.assets | length' 2>/dev/null || echo 0)"
            else
              n="$(curl -s -S -H "Authorization: token ${GH_TOKEN:-${GITHUB_TOKEN}}" \
                "https://api.github.com/repos/${REPO}/releases/tags/${tag}" | \
                python3 -c 'import json, sys; data=json.load(sys.stdin); print(len(data.get("assets", [])))' 2>/dev/null || echo 0)"
            fi
            [[ "${n}" =~ ^[0-9]+$ ]] && (( n > 0 ))
          }

          VERSION="$(read_version)"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: invalid workspace version '${VERSION}' in Cargo.toml" >&2
            exit 1
          fi

          TAG="v${VERSION}"
          HEAD_SHA="$(git rev-parse HEAD)"
          echo "Current Cargo version: ${VERSION} (HEAD ${HEAD_SHA})"

          # Already fully published for this version → stop (no CI↔release thrash).
          if release_has_assets "${TAG}"; then
            echo "GitHub Release ${TAG} already has assets — skipping rebuild"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "release_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Tag points at HEAD but no assets yet → finish publish for this tag.
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n1 "${TAG}")"
            if [ "${TAG_SHA}" = "${HEAD_SHA}" ]; then
              echo "Tag ${TAG} at HEAD, no assets yet — will build and publish"
              echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
              echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
              echo "should_release=true" >> "$GITHUB_OUTPUT"
              echo "release_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Tag exists on older commit: bump version for new main tip
            echo "Tag ${TAG} exists on ${TAG_SHA} — bumping ${BUMP_INPUT} for new commits"
            VERSION="$(bump_semver "${VERSION}" "${BUMP_INPUT}")"
            TAG="v${VERSION}"
            if release_has_assets "${TAG}"; then
              echo "Bumped tag ${TAG} already has assets — skipping"
              echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
              echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "release_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            write_version "${VERSION}"
            git add Cargo.toml Cargo.lock
            git commit -m "chore(release): ${TAG}"
            HEAD_SHA="$(git rev-parse HEAD)"
          else
            echo "Tag ${TAG} does not exist — releasing current Cargo version"
          fi

          # Rebase onto latest main before tag+push (avoids non-fast-forward races
          # and keeps the annotated tag on the final HEAD, not a pre-rebase commit).
          git fetch origin main --quiet
          if ! git rebase origin/main; then
            echo "error: rebase onto origin/main failed" >&2
            git rebase --abort 2>/dev/null || true
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"

          # Ensure tag points at final HEAD (create or move local annotated tag).
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            if [ "$(git rev-list -n1 "${TAG}")" != "${HEAD_SHA}" ]; then
              git tag -d "${TAG}" >/dev/null
              git tag -a "${TAG}" -m "Release ${TAG}"
            fi
          else
            git tag -a "${TAG}" -m "Release ${TAG}"
          fi

          # Push branch then tag (retry once if main moved).
          if ! git push origin "HEAD:refs/heads/main"; then
            echo "push main rejected — rebase and retry once"
            git fetch origin main --quiet
            git rebase origin/main
            HEAD_SHA="$(git rev-parse HEAD)"
            if [ "$(git rev-list -n1 "${TAG}" 2>/dev/null || true)" != "${HEAD_SHA}" ]; then
              git tag -d "${TAG}" >/dev/null 2>&1 || true
              git tag -a "${TAG}" -m "Release ${TAG}"
            fi
            git push origin "HEAD:refs/heads/main"
          fi
          git push origin "refs/tags/${TAG}" || git push origin "${TAG}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "release_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "Will release ${TAG} at ${HEAD_SHA}"

  # Multi-OS build matrix — `ods` only
  build:
    name: Build ${{ matrix.target }}
    needs: [prepare]
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: linux-x86_64
            runs-on: ubuntu-latest
            archive: tar.gz
            use-cross: false

          - target: aarch64-unknown-linux-gnu
            asset: linux-arm64
            runs-on: ubuntu-latest
            archive: tar.gz
            use-cross: true

          - target: aarch64-apple-darwin
            asset: macos-arm64
            runs-on: macos-latest
            archive: tar.gz
            use-cross: false

          - target: x86_64-apple-darwin
            asset: macos-x86_64
            runs-on: macos-latest
            archive: tar.gz
            use-cross: false

          - target: x86_64-pc-windows-msvc
            asset: windows-x86_64
            runs-on: windows-latest
            archive: zip
            use-cross: false

          - target: aarch64-pc-windows-msvc
            asset: windows-arm64
            runs-on: windows-latest
            archive: zip
            use-cross: false

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60

    steps:
      - name: Checkout release SHA
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Export version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release package version: ${TAG}"

      - name: Ensure build tools — Linux (ubuntu-latest)
        if: matrix.runs-on == 'ubuntu-latest' && matrix.use-cross != true
        timeout-minutes: 10
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${HOME}/.cargo/bin:${PATH:-}"
          export RUSTUP_TOOLCHAIN="${RUSTUP_TOOLCHAIN:-stable}"
          export CARGO_TERM_PROGRESS_WHEN=never

          {
            echo "/usr/local/sbin"
            echo "/usr/local/bin"
            echo "/usr/sbin"
            echo "/usr/bin"
            echo "/sbin"
            echo "/bin"
            echo "${HOME}/.cargo/bin"
          } >> "${GITHUB_PATH}"

          run_to() {
            local secs="$1"; shift
            if command -v timeout >/dev/null 2>&1; then
              timeout --foreground --signal=TERM --kill-after=15s "${secs}" "$@"
            else
              "$@"
            fi
          }

          find_linker() {
            for c in cc gcc clang; do
              command -v "$c" >/dev/null 2>&1 && command -v "$c" && return 0
            done
            for c in /usr/bin/cc /usr/bin/gcc /usr/bin/clang /bin/cc; do
              [ -x "$c" ] && echo "$c" && return 0
            done
            return 1
          }

          LINKER="$(find_linker || true)"
          if [ -z "${LINKER}" ]; then
            if command -v apt-get >/dev/null 2>&1; then
              if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
                run_to 300 sudo -n DEBIAN_FRONTEND=noninteractive apt-get update -y
                run_to 600 sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                  build-essential gcc libc6-dev
              elif [ "$(id -u)" -eq 0 ]; then
                run_to 300 DEBIAN_FRONTEND=noninteractive apt-get update -y
                run_to 600 DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                  build-essential gcc libc6-dev
              else
                echo "error: no C linker — install build-essential on the runner" >&2; exit 1
              fi
            fi
            LINKER="$(find_linker || true)"
          fi
          test -n "${LINKER}"
          TARGET_ENV="$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')"
          echo "CARGO_TARGET_${TARGET_ENV}_LINKER=${LINKER}" >> "${GITHUB_ENV}"
          echo "CC=${LINKER}" >> "${GITHUB_ENV}"

          rust_works() {
            command -v rustc >/dev/null 2>&1 \
              && command -v cargo >/dev/null 2>&1 \
              && run_to 20 rustc --version >/dev/null 2>&1 \
              && run_to 20 cargo --version >/dev/null 2>&1
          }
          if ! rust_works; then
            if ! command -v rustup >/dev/null 2>&1; then
              run_to 120 curl --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 \
                --connect-timeout 20 --max-time 90 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
              run_to 420 sh /tmp/rustup-init.sh -y --no-modify-path \
                --default-toolchain stable --profile minimal
              rm -f /tmp/rustup-init.sh
            else
              run_to 420 rustup toolchain install stable --profile minimal
              run_to 30 rustup default stable
            fi
            [ -f "${HOME}/.cargo/env" ] && . "${HOME}/.cargo/env"
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${HOME}/.cargo/bin:${PATH:-}"
          fi
          rust_works || { echo "error: rustc/cargo not usable" >&2; exit 1; }
          rustc --version && cargo --version

          TARGET="${{ matrix.target }}"
          if command -v rustup >/dev/null 2>&1; then
            echo "→ ensuring rustup target: ${TARGET}"
            run_to 120 rustup target add "${TARGET}"
            run_to 180 rustup component add rustfmt clippy llvm-tools-preview --toolchain stable || true
          fi

      - name: Install Rust stable (GitHub-hosted)
        if: matrix.runs-on != 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for aarch64-unknown-linux-gnu)
        if: matrix.use-cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Add macOS cross target
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: rustup target add x86_64-apple-darwin

      - name: Add Windows ARM64 target
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: rustup target add aarch64-pc-windows-msvc

      - name: Build (cross — Linux arm64)
        if: matrix.use-cross == true
        env:
          CROSS_NO_WARNINGS: "0"
        run: cross build --target ${{ matrix.target }} --release --locked

      - name: Build (cargo — all other targets)
        if: matrix.use-cross != true
        shell: bash
        run: cargo build --target ${{ matrix.target }} --release --locked

      - name: Locate release binaries
        id: bins
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          EXT=""
          [ "${{ matrix.archive }}" = "zip" ] && EXT=".exe"

          for d in \
            ".artifacts/target/${TARGET}/release" \
            "src/target/${TARGET}/release" \
            "target/${TARGET}/release" \
            ".artifacts/target/release" \
            "target/release"
          do
            if [ -f "${d}/odc${EXT}" ] || [ -f "${d}/ods${EXT}" ]; then
              echo "dir=${d}" >> "$GITHUB_OUTPUT"
              if [ -f "${d}/odc${EXT}" ]; then
                echo "odc=${d}/odc${EXT}" >> "$GITHUB_OUTPUT"
              else
                echo "odc=${d}/ods${EXT}" >> "$GITHUB_OUTPUT"
              fi
              if [ -f "${d}/ods${EXT}" ]; then
                echo "ods=${d}/ods${EXT}" >> "$GITHUB_OUTPUT"
              else
                echo "ods=${d}/odc${EXT}" >> "$GITHUB_OUTPUT"
              fi
              echo "ext=${EXT}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          FOUND="$(find . -type f \( -path "*/target/${TARGET}/release/odc${EXT}" -o -path "*/target/release/odc${EXT}" -o -path "*/target/${TARGET}/release/ods${EXT}" \) 2>/dev/null | head -1 || true)"
          if [ -n "${FOUND}" ]; then
            DIR="$(dirname "${FOUND}")"
            echo "dir=${DIR}" >> "$GITHUB_OUTPUT"
            echo "odc=${FOUND}" >> "$GITHUB_OUTPUT"
            echo "ods=${FOUND}" >> "$GITHUB_OUTPUT"
            echo "ext=${EXT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "error: release binary odc/ods not found for target ${TARGET}" >&2
          find . -name "odc${EXT}" -o -name "ods${EXT}" -type f 2>/dev/null | head -10 >&2 || true
          exit 1

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.tag }}"
          ASSET="${{ matrix.asset }}"
          # Primary archive name is odc-*; also publish legacy ods-* alias for installers mid-transition
          OUT="odc-${VERSION}-${ASSET}"
          LEGACY="ods-${VERSION}-${ASSET}"
          mkdir -p "dist/${OUT}"

          cp "${{ steps.bins.outputs.odc }}" "dist/${OUT}/odc"
          cp "${{ steps.bins.outputs.ods }}" "dist/${OUT}/ods" 2>/dev/null || cp "${{ steps.bins.outputs.odc }}" "dist/${OUT}/ods"

          cat > "dist/${OUT}/INSTALL.txt" << 'INSTALLEOF'
          OpenDocify CLI (odc) @VERSION@ (@ASSET@)
          Copyright (c) Staytuned LLP. Proprietary — see repository LICENSE.

          First install (private repo — use gh or a logged-in browser):
            gh auth login
            gh release download @VERSION@ -R StaytunedLLP/open-document-spec \
              -p @OUT@.tar.gz -p SHA256SUMS
            tar xzf @OUT@.tar.gz && cd @OUT@
            mkdir -p ~/.local/bin
            install -m 755 odc ~/.local/bin/
            ln -sfn ~/.local/bin/odc ~/.local/bin/ods
            export PATH="$HOME/.local/bin:$PATH"
            export GH_TOKEN="$(gh auth token)"

          After first install:
            odc update
            odc ods init . && odc setup
            # OKF: odc okf init .

          Guide: README.md · Changelog: CHANGELOG.md
          INSTALLEOF
          sed -i.bak "s/@VERSION@/${VERSION}/g; s/@ASSET@/${ASSET}/g; s/@OUT@/${OUT}/g" "dist/${OUT}/INSTALL.txt"
          sed -i.bak 's/^          //' "dist/${OUT}/INSTALL.txt"
          rm -f "dist/${OUT}/INSTALL.txt.bak"

          (cd dist && tar czf "${OUT}.tar.gz" "${OUT}")
          # Legacy alias archive (same payload) for mid-transition installers
          cp -a "dist/${OUT}" "dist/${LEGACY}"
          (cd dist && tar czf "${LEGACY}.tar.gz" "${LEGACY}")

          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${OUT}.tar.gz" "${LEGACY}.tar.gz" >> "SHA256SUMS.${ASSET}")
          elif command -v shasum >/dev/null 2>&1; then
            (cd dist && shasum -a 256 "${OUT}.tar.gz" "${LEGACY}.tar.gz" >> "SHA256SUMS.${ASSET}")
          fi

          ls -lh dist/

      - name: Package (zip)
        if: matrix.archive == 'zip'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $Version = "${{ steps.version.outputs.tag }}"
          $Asset   = "${{ matrix.asset }}"
          $Out     = "odc-$Version-$Asset"
          New-Item -ItemType Directory -Force -Path "dist\$Out" | Out-Null

          Copy-Item "${{ steps.bins.outputs.odc }}" "dist\$Out\odc.exe"
          try { Copy-Item "${{ steps.bins.outputs.ods }}" "dist\$Out\ods.exe" } catch { Copy-Item "${{ steps.bins.outputs.odc }}" "dist\$Out\ods.exe" }

          $InstallText = @"
          OpenDocify CLI (odc) $Version ($Asset)
          Copyright (c) Staytuned LLP. Proprietary -- see repository LICENSE.

          First install (private repo -- use gh or a logged-in browser):
            gh release download $Version -R StaytunedLLP/open-document-spec -p $Out.zip -p SHA256SUMS
            Expand the zip; copy odc.exe (and ods.exe) to a folder on PATH
            Set user env GH_TOKEN for odc update / auto-update

          After first install:
            odc update
            odc ods init .
            odc okf init .   # optional OKF bundle

          Guide: README.md · Changelog: CHANGELOG.md
          "@
          $InstallText | Set-Content "dist\$Out\INSTALL.txt"

          Compress-Archive -Path "dist\$Out" -DestinationPath "dist\$Out.zip" -Force

          $Hash = (Get-FileHash "dist\$Out.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $Out.zip" | Add-Content "dist\SHA256SUMS.$Asset"

          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ods-release-${{ matrix.asset }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.*
          if-no-files-found: error

  # Zed extension / ods-lsp removed from product — release ships `ods` only.

  merge-checksums:
    name: Merge SHA256SUMS
    needs: [prepare, build]
    if: |
      needs.prepare.outputs.should_release == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: ods-release-*
          merge-multiple: true

      - name: Merge and deduplicate checksums
        run: |
          set -euo pipefail
          ls -la dist/
          cat dist/SHA256SUMS.* > dist/SHA256SUMS 2>/dev/null || true
          sort -u dist/SHA256SUMS -o dist/SHA256SUMS
          cat dist/SHA256SUMS
          test -s dist/SHA256SUMS

      - name: Upload merged SHA256SUMS
        uses: actions/upload-artifact@v6
        with:
          name: ods-release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, build, merge-checksums]
    if: |
      always() &&
      needs.prepare.outputs.should_release == 'true' &&
      needs.build.result == 'success' &&
      needs.merge-checksums.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: ods-release-*
          merge-multiple: true

      - name: List assets
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.release_sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-release:
    name: Verify Published Release Assets
    needs: [prepare, publish]
    if: |
      always() &&
      needs.prepare.outputs.should_release == 'true' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Download and verify published assets
        run: |
          set -euo pipefail
          mkdir -p verify
          cd verify

          expected=(
            "ods-${TAG}-linux-x86_64.tar.gz"
            "ods-${TAG}-linux-arm64.tar.gz"
            "ods-${TAG}-macos-x86_64.tar.gz"
            "ods-${TAG}-macos-arm64.tar.gz"
            "ods-${TAG}-windows-x86_64.zip"
            "ods-${TAG}-windows-arm64.zip"
            "SHA256SUMS"
          )

          if command -v gh &>/dev/null; then
            for asset in "${expected[@]}"; do
              echo "checking release asset: ${asset}"
              gh release view "${TAG}" -R "${REPO}" --json assets \
                --jq '.assets[].name' | grep -Fx "${asset}" >/dev/null
            done

            for asset in "${expected[@]}"; do
              gh release download "${TAG}" -R "${REPO}" -p "${asset}"
            done
          else
            echo "gh CLI not found; falling back to curl + python3"
            RELEASE_JSON="$(curl -s -S -H "Authorization: token ${GH_TOKEN:-${GITHUB_TOKEN}}" \
              "https://api.github.com/repos/${REPO}/releases/tags/${TAG}")"
            if echo "${RELEASE_JSON}" | grep -q "message.*Not Found"; then
              echo "error: release not found via GitHub API" >&2
              exit 1
            fi
            for asset in "${expected[@]}"; do
              echo "checking and downloading release asset: ${asset}"
              ASSET_URL=$(echo "${RELEASE_JSON}" | python3 -c "
            import sys, json
            data = json.load(sys.stdin)
            assets = data.get('assets', [])
            found = [a['url'] for a in assets if a['name'] == '${asset}']
            if found:
                print(found[0])
            ")
              if [ -z "${ASSET_URL}" ]; then
                echo "error: asset ${asset} not found in release assets" >&2
                exit 1
              fi
              curl -s -S -L -H "Authorization: token ${GH_TOKEN:-${GITHUB_TOKEN}}" \
                -H "Accept: application/octet-stream" \
                -o "${asset}" "${ASSET_URL}"
            done
          fi

          for asset in "${expected[@]}"; do
            [ -s "${asset}" ] || { echo "error: ${asset} is missing or empty" >&2; exit 1; }
          done

          sha256sum -c SHA256SUMS
