name: 'Open Document Spec (ODS) CI Action'
description: 'Install ODS CLI (ods) and validate ODS document graphs, frontmatter compliance, profile schemas, and index freshness.'
author: 'Staytuned LLP'
branding:
  icon: 'file-text'
  color: 'blue'

inputs:
  version:
    description: 'Open Document Spec (ods) release version tag to install (e.g., "latest", "v0.0.13", "0.0.13").'
    required: false
    default: 'latest'
  command:
    description: 'CLI subcommand to execute ("lint", "index-check", "doctor", "fmt-check", "bench", "export", or "" for setup-only).'
    required: false
    default: 'lint'
  path:
    description: 'Target workspace directory path relative to repo root.'
    required: false
    default: '.'
  level:
    description: 'Lint compliance level for ODS lint ("1" or "3").'
    required: false
    default: '3'
  format:
    description: 'Output format for CLI diagnostics ("text" or "json").'
    required: false
    default: 'text'
  token:
    description: 'GitHub token for fetching release binaries from private or public GitHub Releases.'
    required: false
    default: ${{ github.token }}
  annotate:
    description: 'Enable GitHub inline PR code annotations for lint errors via problem matcher ("true" or "false").'
    required: false
    default: 'true'
  extra-args:
    description: 'Additional raw command line arguments to pass to the Open Document Spec CLI.'
    required: false
    default: ''

outputs:
  ods-version:
    description: 'Installed Open Document Spec (ods) CLI version.'
    value: ${{ steps.setup-unix.outputs.ods-version || steps.setup-win.outputs.ods-version }}
  ods-path:
    description: 'Absolute path to the installed ods binary.'
    value: ${{ steps.setup-unix.outputs.ods-path || steps.setup-win.outputs.ods-path }}

runs:
  using: 'composite'
  steps:
    - name: Setup and Run ODS Action (Linux / macOS)
      id: setup-unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_LEVEL: ${{ inputs.level }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_ANNOTATE: ${{ inputs.annotate }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        SCRIPT_PATH="${{ github.action_path }}/src/action/scripts/setup.sh"
        if [ ! -f "${SCRIPT_PATH}" ]; then
          SCRIPT_PATH="${{ github.action_path }}/scripts/setup.sh"
        fi
        "${SCRIPT_PATH}"

    - name: Setup and Run ODS Action (Windows)
      id: setup-win
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_PATH: ${{ inputs.path }}
        INPUT_LEVEL: ${{ inputs.level }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_ANNOTATE: ${{ inputs.annotate }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        $ScriptPath = Join-Path "${{ github.action_path }}" "src\action\scripts\setup.ps1"
        if (-not (Test-Path $ScriptPath)) {
          $ScriptPath = Join-Path "${{ github.action_path }}" "scripts\setup.ps1"
        }
        & $ScriptPath

