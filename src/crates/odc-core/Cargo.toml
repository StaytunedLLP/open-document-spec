[package]
name = "odc-core"
description = "OpenDocify core library — ODS + native OKF v0.2"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[dev-dependencies]
odc-test-support = { path = "../odc-test-support" }
tempfile = "3"

